<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portofolio Proyek - Modul 4</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #172554;
            --primary-soft: #eff6ff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --background: #f1f5f9;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --pending-bg: #fef9c3;
            --pending-text: #854d0e;
            --danger: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
            padding: 30px 15px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 28px;
            background: #fff;
            border: 1px solid #e8edf4;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.07);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 22px;
        }

        h1 {
            color: var(--primary);
            font-size: clamp(24px, 4vw, 32px);
            line-height: 1.2;
            margin-bottom: 7px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        .section {
            margin-top: 26px;
        }

        .section-heading {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 13px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 17px;
            text-align: center;
        }

        .stat-card h3 {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 7px;
        }

        .stat-card p {
            color: var(--primary);
            font-size: clamp(20px, 3vw, 25px);
            font-weight: 750;
            overflow-wrap: anywhere;
        }

        .form-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-field label,
        .checkbox-label {
            font-size: 13px;
            font-weight: 650;
            color: #334155;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            min-height: 42px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            padding: 9px 11px;
            background: white;
            color: var(--text);
            font-size: 14px;
        }

        input:focus,
        select:focus,
        button:focus-visible {
            outline: 3px solid #bfdbfe;
            outline-offset: 1px;
            border-color: #2563eb;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 42px;
        }

        input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--primary);
        }

        .button {
            border: 1px solid transparent;
            border-radius: 7px;
            padding: 9px 13px;
            min-height: 38px;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
            transition: background .15s ease, transform .15s ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button-primary {
            background: var(--primary);
            color: white;
        }

        .button-primary:hover {
            background: var(--primary-dark);
        }

        .button-secondary {
            background: white;
            color: var(--primary);
            border-color: #cbd5e1;
        }

        .button-secondary:hover {
            background: var(--primary-soft);
        }

        .button-danger {
            color: var(--danger);
            border-color: #fecaca;
            background: #fff;
        }

        .button-danger:hover {
            background: #fef2f2;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 17px;
            flex-wrap: wrap;
        }

        .form-message {
            min-height: 20px;
            font-size: 13px;
            color: var(--muted);
        }

        .form-message.error {
            color: var(--danger);
        }

        .form-message.success {
            color: #166534;
        }

        .tools-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .search-wrap {
            flex: 1 1 260px;
        }

        .search-wrap label {
            display: block;
            font-size: 13px;
            font-weight: 650;
            color: #334155;
            margin-bottom: 6px;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 19px;
            flex-wrap: wrap;
        }

        .btn-filter {
            padding: 8px 13px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all .15s ease;
        }

        .btn-filter.active,
        .btn-filter:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .project-list {
            display: grid;
            gap: 12px;
        }

        .project-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            background: #fff;
            transition: box-shadow .15s ease, transform .15s ease;
        }

        .project-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.06);
        }

        .project-info {
            min-width: 0;
        }

        .project-info h3 {
            font-size: 16px;
            color: var(--text);
            margin: 4px 0;
            overflow-wrap: anywhere;
        }

        .project-category {
            display: inline-block;
            font-size: 11px;
            color: #075985;
            background: #e0f2fe;
            padding: 3px 9px;
            border-radius: 5px;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .project-budget {
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        .project-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 11px;
            flex-shrink: 0;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge-pending {
            background: var(--pending-bg);
            color: var(--pending-text);
        }

        .project-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .project-actions .button {
            padding: 7px 10px;
            min-height: 34px;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 28px 16px;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
        }

        @media (max-width: 650px) {
            body { padding: 14px 9px; }
            .container { padding: 18px 14px; border-radius: 12px; }
            .stats-grid { grid-template-columns: 1fr; gap: 9px; }
            .stat-card { padding: 12px; }
            .stat-card p { font-size: 22px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-field.full-width { grid-column: auto; }
            .project-card { align-items: flex-start; flex-direction: column; }
            .project-status { width: 100%; align-items: flex-start; }
            .project-actions { justify-content: flex-start; }
            .page-header { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div>
                <h1>Portofolio Proyek</h1>
                <p class="subtitle">Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM</p>
            </div>
        </header>

        <section aria-label="Statistik portofolio">
            <div class="stats-grid">
                <article class="stat-card">
                    <h3>Total Proyek</h3>
                    <p id="stat-total-projects">0</p>
                </article>
                <article class="stat-card">
                    <h3>Total Anggaran</h3>
                    <p id="stat-total-budget">Rp 0</p>
                </article>
                <article class="stat-card">
                    <h3>Selesai Dikerjakan</h3>
                    <p id="stat-completed-projects">0</p>
                </article>
            </div>
        </section>

        <section class="section" aria-labelledby="form-heading">
            <h2 class="section-heading" id="form-heading">Tambah Proyek Baru</h2>
            <form id="project-form" class="form-card" novalidate>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="project-title">Judul Proyek</label>
                        <input
                            type="text"
                            id="project-title"
                            name="title"
                            placeholder="Contoh: Website Toko Online"
                            required
                            maxlength="120"
                        >
                    </div>

                    <div class="form-field">
                        <label for="project-category">Kategori Proyek</label>
                        <select id="project-category" name="category" required>
                            <option value="Web App">Web App</option>
                            <option value="Mobile App">Mobile App</option>
                            <option value="Desktop App">Desktop App</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="project-budget">Estimasi Anggaran (Rp)</label>
                        <input
                            type="number"
                            id="project-budget"
                            name="budget"
                            placeholder="Contoh: 2500000"
                            min="1"
                            step="1"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <span class="checkbox-label">Status Proyek</span>
                        <label class="checkbox-row" for="project-completed">
                            <input type="checkbox" id="project-completed" name="completed">
                            <span>Sudah Selesai</span>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-primary">+ Tambah Proyek</button>
                    <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>

        <section class="section" aria-labelledby="list-heading">
            <h2 class="section-heading" id="list-heading">Daftar Proyek</h2>

            <div class="tools-row">
                <div class="search-wrap">
                    <label for="project-search">Cari proyek berdasarkan judul</label>
                    <input
                        type="text"
                        id="project-search"
                        placeholder="Ketik kata kunci proyek..."
                        autocomplete="off"
                    >
                </div>
            </div>

            <div class="filter-group" role="group" aria-label="Filter kategori proyek">
                <button type="button" class="btn-filter active" data-category="Semua" aria-pressed="true">Semua Proyek</button>
                <button type="button" class="btn-filter" data-category="Web App" aria-pressed="false">Web App</button>
                <button type="button" class="btn-filter" data-category="Mobile App" aria-pressed="false">Mobile App</button>
                <button type="button" class="btn-filter" data-category="Desktop App" aria-pressed="false">Desktop App</button>
                <button type="button" class="btn-filter" data-category="UI/UX Design" aria-pressed="false">UI/UX Design</button>
            </div>

            <div id="project-list" class="project-list" aria-live="polite"></div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
